name: Exercice 2 - Artefact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          if [ ! -f dist/index.js ]; then
            echo "::error file=dist/index.js::Le build n'a rien produit"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
      - if: always()
        run: |
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "- Statut : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branche : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit : ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Date : $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- Node : $(node -v)" >> $GITHUB_STEP_SUMMARY
